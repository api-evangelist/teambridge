summary: >-
  Entity-relationship graph derived from the Teambridge External API OpenAPI. The
  API is a unified Collections model: a Collection defines Fields and holds Records;
  Records can be linked to external systems via Mappings; Documents are uploaded
  files. Standard collections include shifts, users, placements, and locations,
  alongside customer-defined custom collections.
