name: Teambridge
description: >-
  Teambridge is an AI-native workforce-management platform for frontline and hourly
  teams, unifying scheduling, time tracking, instant pay, team communication,
  onboarding, compliance, and payroll behind autonomous AI agents. For integrators
  it publishes the Teambridge External API, a unified Collections API (OpenAPI 3.1.0)
  that reads and writes shifts, users, placements, locations, and custom collections,
  authenticated with OAuth 2.0 client credentials and complemented by HMAC-signed
  outbound webhooks for real-time change notification. Teambridge is backed by
  General Catalyst and Mayfield and reports SOC 2 Type II, ISO 27001, HIPAA, and
  GDPR compliance.
